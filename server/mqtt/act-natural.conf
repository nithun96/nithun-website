# Mosquitto: the message relay (MQTT broker) for Act Natural, on the Hetzner server.
# Copy to /etc/mosquitto/conf.d/act-natural.conf on the server (see README.md).
#
# Listens on the server itself only. Phones and the TV reach it through Nginx at
# wss://nithun.no/lab/act-natural/mqtt (nginx/nithun-website), so it needs no open port,
# no certificate of its own, and works on networks that only allow port 443.
listener 9001 127.0.0.1
protocol websockets

# No logins: everything the game sends is end-to-end encrypted before it gets here (the key
# travels only in the QR code), so the broker can't read it. The topic rules below keep
# anyone else from using it for anything but Act Natural's topics.
allow_anonymous true
acl_file /etc/mosquitto/act-natural.acl

# Limits, so the broker can't be used to exhaust the server. A game is 1 TV + up to 20
# phones; a message is at most a few kB (the Hunter's map of every blob).
max_connections 200
max_packet_size 65536
max_queued_messages 200
max_keepalive 120
