# coturn: relay (TURN) server for Act Natural, on the Hetzner server.
# Copy to /etc/turnserver.conf on the server and replace CHANGE_ME there (see README.md).
# Never commit the real secret.

# Ports: 3478 for plain STUN/TURN (UDP and TCP), 5349 for TURN over TLS.
listening-port=3478
tls-listening-port=5349

# Who we are. external-ip is the server's public address.
realm=nithun.no
server-name=nithun.no
external-ip=204.168.209.150

# The UDP ports relayed traffic uses. Open the same range in the firewall.
min-port=49160
max-port=49200

# Logins: the game gets short-lived ones made from this shared secret at build time
# (username "<expiry>:actnatural", password = HMAC-SHA1 of the username with the secret).
use-auth-secret
static-auth-secret=CHANGE_ME
fingerprint

# TLS certificate: copies of the Let's Encrypt one for nithun.no, kept fresh by a certbot hook.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# Safety: no admin console, no relaying to the server itself or private networks.
no-cli
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits, since anyone who reads the game page can use the login until it expires.
user-quota=40
total-quota=60
stale-nonce=600

# Logging: short lines to the system log (journalctl -u coturn).
log-file=syslog
simple-log
