# XcodeGen spec — run `xcodegen` in this folder to make Silence.xcodeproj.
# The .xcodeproj is generated, so it isn't committed; change settings here.
name: Silence
options:
  bundleIdPrefix: no.nithun          # placeholder — confirm before the App Store record is made
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""             # your Apple Developer Team ID, once enrolled
    CODE_SIGN_STYLE: Automatic
targets:
  Silence:
    type: application
    platform: iOS
    sources: [Silence]
    info:
      path: Silence/Info.plist      # generated by XcodeGen, merged with Xcode's own keys
      properties:
        UIBackgroundModes: [audio]   # keep playing with the screen locked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.nithun.silence
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Silence
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        # The sounds are made on the phone; unoptimised Swift takes many seconds
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  SilenceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SilenceTests
      - path: tools/golden.json      # reference samples from the website
        buildPhase: resources
    dependencies:
      - target: Silence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: no.nithun.silence.tests
schemes:
  Silence:
    build:
      targets:
        Silence: all
        SilenceTests: [test]
    test:
      targets: [SilenceTests]
