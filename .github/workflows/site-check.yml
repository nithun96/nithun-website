# Hourly check that nithun.no still serves exactly what the last deploy uploaded.
# Catches a changed or defaced site (e.g. after someone gets into the server):
# every file from the last successful Deploy run must match the live file byte for
# byte, and the security headers must match nginx/nithun-website at that commit.
# A mismatch fails the run, and GitHub emails about the failure.
# Reads only; changes nothing.
name: Site check

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # to download the last deploy's files

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: https://nithun.no
    steps:
      - name: Find the last successful deploy
        id: last
        run: |
          # Skip while a deploy is running: the live files would be half old, half new.
          # (Not a shared concurrency group: a queued check could cancel a queued deploy.)
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != "0" ]; then echo "::notice::A deploy is running; checking next hour."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 1 --json databaseId,headSha -q '.[0]')
          if [ -z "$run" ]; then echo "::error::No successful Deploy run to compare with"; exit 1; fi
          echo "id=$(jq -r .databaseId <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .headSha <<<"$run")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7   # the deployed commit, for its Nginx config; runs no repo code
        if: steps.last.outputs.skip != 'true'
        with:
          ref: ${{ steps.last.outputs.sha }}

      - name: Download the files that deploy uploaded
        if: steps.last.outputs.skip != 'true'
        run: |
          if ! gh run download "${{ steps.last.outputs.id }}" -R "$GITHUB_REPOSITORY" -n site -D deployed; then
            echo "::error::The last deploy's files have expired (kept 90 days). Run Deploy again by hand to refresh them."
            exit 1
          fi

      - name: Every deployed file matches the live site
        if: steps.last.outputs.skip != 'true'
        run: |
          set -o pipefail
          cd deployed
          fail=0; n=0
          while IFS= read -r f; do
            n=$((n + 1))
            want=$(sha256sum "$f" | cut -d' ' -f1)
            got=$(curl -fsS --retry 2 "$SITE/$f" | sha256sum | cut -d' ' -f1) || got="could not fetch"
            if [ "$want" != "$got" ]; then echo "::error::Different on the live site: /$f"; fail=1; fi
          done < <(find . -type f -printf '%P\n' | LC_ALL=C sort)
          echo "Checked $n files."
          exit $fail

      - name: Security headers match the Nginx config
        if: ${{ !cancelled() && steps.last.outputs.skip != 'true' }}
        run: |
          headers=$(curl -fsSI "$SITE/" | tr -d '\r')
          fail=0
          for name in Content-Security-Policy Strict-Transport-Security X-Frame-Options X-Content-Type-Options Referrer-Policy Permissions-Policy Cross-Origin-Opener-Policy; do
            want=$(grep -oP "add_header $name \"\K[^\"]+" nginx/nithun-website | head -1)
            got=$(grep -i "^$name:" <<<"$headers" | head -1 | cut -d' ' -f2-)
            if [ "$want" != "$got" ]; then echo "::error::$name differs. Expected: $want  Live: $got"; fail=1; fi
          done
          exit $fail
